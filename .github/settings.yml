repository:
  private: false
  default_branch: main
  has_issues: true
  has_projects: true
  has_wiki: true
  has_discussions: false
  is_template: false
  allow_forking: true
  web_commit_signoff_required: false
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: false
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  # セキュリティ（2026-10-12 の観測値を写したもの）
  # dependabot_security_updates は enable_automated_security_fixes で表す。secret_scanning_validity_checks は
  # PATCH の入力に無いので書かない。topics は空なので書かない（書くならカンマ区切りの文字列）
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled
    secret_scanning_non_provider_patterns:
      status: disabled
  enable_vulnerability_alerts: true       # gh api .../vulnerability-alerts が 204 なら true、404 なら false
  enable_automated_security_fixes: true   # gh api .../automated-security-fixes の enabled

labels:
  - name: accessibility
    color: "f143ab"
    description: Barrier affecting people with disabilities
  - name: "agent:go"
    color: "0E8A16"
    description: 人だけが付ける。エージェントが実行してよい Issue
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: duplicate
    color: "cfd3d7"
    description: This issue or pull request already exists
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: good first issue
    color: "7057ff"
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
  - name: question
    color: "d876e3"
    description: Further information is requested
  - name: "triage:close-candidate"
    color: "bfdadc"
    description: "triage: close 候補"
  - name: "triage:merge-ready"
    color: "0e8a16"
    description: "triage: マージ候補（承認を取ってマージ）"
  - name: "triage:needs-decision"
    color: "fbca04"
    description: "triage: 人の判断が要る"
  - name: "triage:needs-fix"
    color: "d93f0b"
    description: "triage: CI 失敗か競合。直す必要あり"
  - name: "triage:pending"
    color: "c5def5"
    description: "triage: CI 実行中など。次回に回す"
  - name: "triage:worker-ready"
    color: "1d76db"
    description: "triage: ワーカーに出せる"
  - name: wontfix
    color: "ffffff"
    description: This will not be worked on

branches:
  - name: main
    protection:
      required_status_checks:
        strict: false
        checks:
          - context: ci / just ci
            app_id: 15368
      required_pull_request_reviews:
        dismiss_stale_reviews: false
        require_code_owner_reviews: true
        require_last_push_approval: false
        required_approving_review_count: 0
      enforce_admins: false
      restrictions: null
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
      block_creations: false
      required_conversation_resolution: false
      lock_branch: false
      allow_fork_syncing: false
